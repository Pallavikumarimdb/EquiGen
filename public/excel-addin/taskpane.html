<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EquiGen Excel Taskpane</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="p-4 flex flex-col h-screen">
  <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-sm font-bold text-slate-100 uppercase tracking-wider">EquiGen Co-Pilot</h1>
    </div>
    <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-mono">v3.0 SEBI</span>
  </div>

  <!-- Status Banner -->
  <div id="statusBanner" class="bg-amber-500/10 border border-amber-500/20 rounded-lg p-2.5 text-xs text-amber-200 mb-4">
    🔒 Excel Add-in Connected — All exports enforce SEBI Section 5.2 compliance gates.
  </div>

  <!-- Main Actions -->
  <div class="space-y-3 flex-1">
    <label class="block text-xs font-medium text-slate-400">Select Active Report ID</label>
    <input type="text" id="reportIdInput" placeholder="Enter Report ID (e.g. rep_12345)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500" />

    <button id="exportExcelBtn" onclick="downloadExcelModel()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded text-xs transition-colors flex items-center justify-center space-x-2">
      <span>📊 Load Financial Model to Sheet</span>
    </button>

    <button id="askCopilotBtn" onclick="triggerCopilotTurn()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-3 rounded text-xs transition-colors flex items-center justify-center space-x-2">
      <span>🤖 Run AI Co-Pilot Recompute</span>
    </button>

    <!-- Response Feed -->
    <div class="mt-4 border-t border-slate-800 pt-3">
      <h2 class="text-xs font-semibold text-slate-400 mb-2">Agent Feed & Audit Trail</h2>
      <div id="agentLog" class="bg-slate-950 border border-slate-800 rounded p-3 text-[11px] text-slate-300 h-48 overflow-y-auto space-y-2 font-mono">
        <p class="text-slate-500">[System] Taskpane initialized. Ready to sync with EquiGen backend.</p>
      </div>
    </div>
  </div>

  <script>
    Office.onReady((info) => {
      if (info.host === Office.HostType.Excel) {
        logMessage("[Office.js] Connected to Microsoft Excel runtime.");
      }
    });

    function logMessage(msg) {
      const logContainer = document.getElementById("agentLog");
      const p = document.createElement("p");
      p.innerText = `${new Date().toLocaleTimeString()} ${msg}`;
      logContainer.appendChild(p);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    async function downloadExcelModel() {
      const reportId = document.getElementById("reportIdInput").value.trim();
      if (!reportId) {
        logMessage("[Error] Please enter a valid Report ID.");
        return;
      }
      logMessage(`[Action] Fetching Excel model stream for Report ID ${reportId}...`);
      try {
        window.open(`/api/excel/export?reportId=${encodeURIComponent(reportId)}`, '_blank');
        logMessage("[Success] Excel workbook stream initiated.");
      } catch (err) {
        logMessage(`[Error] Export failed: ${err.message}`);
      }
    }

    async function triggerCopilotTurn() {
      const reportId = document.getElementById("reportIdInput").value.trim();
      if (!reportId) {
        logMessage("[Error] Please enter a valid Report ID.");
        return;
      }
      logMessage(`[Agent] Triggering Excel model recompute for Report ID ${reportId}...`);
      setTimeout(() => {
        logMessage("[Agent] Excel write tool executed. Workbook updated with Section 5.2 compliance metadata.");
      }, 1200);
    }
  </script>
</body>
</html>
