services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bull-ai-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      # Persistent storage for generated PDFs and charts
      - reports_data:/app/public/temp
    restart: always

volumes:
  reports_data:
    driver: local
