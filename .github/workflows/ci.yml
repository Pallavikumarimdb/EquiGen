name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Fail the whole job if any step fails.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Secret scan ────────────────────────────────────────────────────────
      # Runs first and fast. This repository previously shipped two hardcoded
      # credentials that lint and typecheck both accepted: a JWT signing fallback and
      # an AES-256-GCM master key for every tenant's provider keys.
      - name: Scan committed files for secrets
        run: pnpm audit:secrets

      - name: TypeScript
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit tests get placeholder values for DATABASE_URL / ENCRYPTION_KEY /
      # JWT_SECRET via vitest.config.ts. The app itself now refuses to boot without
      # them, which is the behaviour these tests assert around.
      - name: Unit tests
        run: pnpm test:unit

      # ── Dependency audit ───────────────────────────────────────────────────
      # The Next.js version in this repo is behind and the tenant boundary depends
      # on framework behaviour, so high-severity advisories block the build.
      - name: Dependency audit
        run: pnpm audit:deps

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only on demand or on main: the E2E suite needs a database and a browser.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equigen_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equigen_e2e
        run: pnpm prisma db push --skip-generate

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equigen_e2e
          # No production defaults exist for any of these; the app fails closed
          # without them, which is exactly what CI should exercise.
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
        run: pnpm test:e2e